# Build and test on pull requests and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8 and 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test (Release, net8.0 and net10.0)
        run: dotnet test -c Release

      - name: Pack (check only, not published)
        run: dotnet pack LinearRegression/LinearRegression.csproj -c Release -o artifacts
